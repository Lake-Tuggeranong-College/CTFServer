services:

  blanddudeswebsite:
    build: ./web
    image: blanddudeswebsite:latest
    container_name: blanddudeswebsite
    ports:
      - "${HTTP_PORT}:80"
    restart: unless-stopped

  sshtest-server:
    build: ./ssh
    container_name: BACTA-ssh
    ports:
      - "${SSH_PORT}:22"
    restart: unless-stopped
